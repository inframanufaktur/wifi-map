[package]
name = "wifimap"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Named WiFi surveys and path diagnostics in a terminal dashboard"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
csv = "1"
libc = "0.2"
plist = "1"
ratatui = "0.30.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
