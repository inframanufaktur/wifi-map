name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    name: Verify native macOS application
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Check, test, and build
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
          python3 scripts/smoke_tui.py
          python3 -m unittest discover -s tests -p migration_test.py

  verify:
    name: Verify Rust application and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify formatting and static analysis
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Install documentation toolchain
        run: npm ci

      - name: Run Rust tests and build
        run: |
          cargo test --locked
          cargo build --locked --release
          python3 scripts/smoke_tui.py
          python3 -m unittest discover -s tests -p migration_test.py

      - name: Build production documentation
        run: npm run docs:build

      - name: Run documentation contracts
        run: npm run docs:test

  deploy:
    name: Deploy production documentation
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: [verify, native-macos]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: docs-production
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Rebuild verified documentation
        run: |
          npm ci
          npm run docs:build

      - name: Configure deployment SSH identity
        env:
          UBERSPACE_SSH_KEY: ${{ secrets.UBERSPACE_SSH_KEY }}
          UBERSPACE_SSH_KNOWN_HOSTS: ${{ secrets.UBERSPACE_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$UBERSPACE_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$UBERSPACE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null

      - name: Mirror site to Uberspace DocumentRoot
        env:
          UBERSPACE_HOST: ${{ secrets.UBERSPACE_HOST }}
          UBERSPACE_SSH_USER: ${{ secrets.UBERSPACE_SSH_USER }}
          UBERSPACE_WEB_ROOT: ${{ vars.UBERSPACE_WEB_ROOT }}
        run: |
          rsync -avz --delete --chmod=D755,F644 \
            -e "ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -o BatchMode=yes -o PreferredAuthentications=publickey" \
            docs/_site/ \
            "$UBERSPACE_SSH_USER@$UBERSPACE_HOST:/var/www/virtual/$UBERSPACE_SSH_USER/$UBERSPACE_WEB_ROOT/"
